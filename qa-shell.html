<style id="qa-shell-css">
#qa-lab-open{position:fixed;bottom:20px;right:20px;z-index:2147482000;background:#155483;color:white;border:1px solid #ffffff65;border-radius:17px;padding:12px 18px;font:700 15px/1.5 Tahoma,Arial,sans-serif;box-shadow:0 8px 27px #061f3566;cursor:pointer;touch-action:manipulation}
#qa-lab-shell[hidden]{display:none!important}
#qa-lab-shell{position:fixed;inset:0;z-index:2147482500;overflow:auto;background:#eef3f8;color:#19374e;direction:rtl;font-family:Tahoma,Arial,sans-serif;overscroll-behavior:contain}
#qa-lab-shell *{box-sizing:border-box}
#qa-lab-shell .qa-wrap{width:min(1100px,100%);margin:0 auto;padding:15px 15px 65px}
#qa-lab-shell .qa-head{position:sticky;top:0;z-index:10;background:#102d4b;color:#fff;padding:15px 18px;display:flex;align-items:center;gap:12px;justify-content:space-between;box-shadow:0 3px 12px #102d4b22}
#qa-lab-shell .qa-head h1{font:bold 18px/1.5 Tahoma,Arial,sans-serif;margin:0}
#qa-lab-shell .qa-back{padding:10px 14px;background:#fff;color:#173e5f;border:0;border-radius:10px;font:700 14px Tahoma,Arial;cursor:pointer}
#qa-lab-shell .qa-desc{line-height:1.8;margin:14px 0;color:#4a6375;font-size:14px}
#qa-lab-shell .qa-filter{display:flex;gap:7px;overflow:auto;padding:4px 0 12px;scrollbar-width:thin}
#qa-lab-shell .qa-filter button{white-space:nowrap;font:700 14px Tahoma,Arial,sans-serif;padding:9px 13px;border-radius:999px;border:1px solid #b9cdda;background:#fff;color:#204f71;cursor:pointer}
#qa-lab-shell .qa-filter button[aria-pressed="true"]{background:#165e91;color:#fff;border-color:#165e91}
#qa-lab-shell #nur-qa{--card:#fff;--background:#fff;--border:#d8e4ed;--foreground:#183248;--muted-foreground:#576b7e;--color-primary:#155c90;--font-display:Tahoma,Arial;--color-myelin:#d5b678;display:flex;flex-direction:column;gap:16px}
#qa-lab-shell #nur-qa .nq-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#qa-lab-shell #nur-qa .nq-title{font:700 19px/1.5 Tahoma,Arial,sans-serif;flex:1;min-width:170px;margin:0;color:#143b58}
#qa-lab-shell #nur-qa .nq-rec{border:1px solid #c4d5e0;border-radius:999px;padding:10px 15px;font:700 14px Tahoma,Arial,sans-serif;background:#e9f3fa;color:#165684;cursor:pointer}
#qa-lab-shell #nur-qa .nq-grid{display:grid;gap:17px;grid-template-columns:1fr}
@media(min-width:820px){#qa-lab-shell #nur-qa .nq-grid{grid-template-columns:1fr 1fr}}
#qa-lab-shell #nur-qa .nq-card{background:white;border:1px solid #d8e4ed;border-radius:17px;padding:17px;align-self:start;min-width:0;box-shadow:0 3px 14px #153f5b0b}
#qa-lab-shell #nur-qa .nq-st{font:700 18px/1.6 Tahoma,Arial,sans-serif;color:#185b87;margin:0 0 9px}
#qa-lab-shell #nur-qa .nq-item{border-top:1px solid #e1e8ee;min-width:0}
#qa-lab-shell #nur-qa .nq-q{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:right;padding:13px 0;border:0;background:transparent;color:#183248;font:600 16px/1.8 Tahoma,Arial,sans-serif;cursor:pointer}
#qa-lab-shell #nur-qa .nq-qt{display:flex;gap:7px;flex-wrap:wrap;flex:1}
#qa-lab-shell #nur-qa .nq-wiz{font-size:12px;background:#feefd0;color:#784d04;border-radius:7px;padding:2px 6px}
#qa-lab-shell #nur-qa .nq-yr{font-size:12px;background:#e7f0f7;border-radius:7px;padding:2px 6px}
#qa-lab-shell #nur-qa .nq-chev{color:#647f92;font-size:24px;transition:transform .15s}
#qa-lab-shell #nur-qa .nq-item.open .nq-chev{transform:rotate(180deg)}
#qa-lab-shell #nur-qa .nq-ans{display:none;flex-direction:column;gap:12px;padding-bottom:14px;font-size:15px;line-height:1.9;min-width:0}
#qa-lab-shell #nur-qa .nq-item.open .nq-ans{display:flex}
#qa-lab-shell #nur-qa .nq-pre{white-space:pre-line}
#qa-lab-shell #nur-qa .nq-tw{overflow-x:auto}
#qa-lab-shell #nur-qa .nq-table{border-collapse:collapse;width:100%}
#qa-lab-shell #nur-qa .nq-table th,#qa-lab-shell #nur-qa .nq-table td{border:1px solid #d8e4ed;padding:8px;vertical-align:top;white-space:pre-line;text-align:right}
#qa-lab-shell #nur-qa .nq-table th{background:#f0f5f9}
#qa-lab-shell #nur-qa .nq-voice{border:1px solid #c9deea;background:#f3f8fb;padding:9px 12px;margin:7px 0;border-radius:11px}
#qa-lab-shell #nur-qa .nq-voice button{border:1px solid #b2cbdc;border-radius:9px;padding:8px 12px;background:#fff;font:600 13px Tahoma,Arial;color:#164b74;cursor:pointer}
#qa-lab-shell #nur-qa .nq-voice audio{display:block;width:100%;margin-top:8px}
#qa-lab-shell #nur-qa .nq-vt{font-size:13px;font-weight:700;margin-bottom:6px}
#qa-lab-shell .qa-loading{padding:30px;text-align:center;font:600 15px Tahoma,Arial}
@media(max-width:600px){#qa-lab-shell .qa-wrap{padding:12px 10px 50px}#qa-lab-shell #nur-qa .nq-card{padding:14px}#qa-lab-open{right:12px;bottom:12px;padding:11px 14px}}
</style>
<button type="button" id="qa-lab-open" aria-haspopup="dialog" aria-controls="qa-lab-shell">📘 سؤال وجواب</button>
<section id="qa-lab-shell" aria-label="مختبر السؤال والجواب" role="dialog" aria-modal="true" dir="rtl" hidden>
  <div class="qa-head"><h1>مختبر الأحياء · السؤال والجواب</h1><button type="button" class="qa-back" id="qa-lab-close">✕ العودة للمختبر</button></div>
  <div class="qa-wrap"><p class="qa-desc">اختر الموضوع، افتح السؤال، وسمّع إجابتك أو اكتبها داخل نفس السؤال. تگدر تقارنها بجواب المنهج الأصلي.</p><div class="qa-filter" role="group" aria-label="تصفية الأسئلة حسب الموضوع"></div><div id="nur-qa" data-topic="all"><div class="qa-loading">جاري تحميل أسئلة المنهج...</div></div></div>
</section>
<script id="qa-shell-script">
(()=>{'use strict';
const open=document.getElementById('qa-lab-open'),shell=document.getElementById('qa-lab-shell'),close=document.getElementById('qa-lab-close'),host=document.getElementById('nur-qa'),filter=shell.querySelector('.qa-filter');
const TOP={all:'كل الأسئلة',parts:'مكونات الجهاز العصبي',divisions:'أقسام الجهاز العصبي',physio:'فسلجة الجهاز العصبي',disease:'بعض أمراض الجهاز العصبي',wiz:'الأسئلة الوزارية'};
let data=null,loading=null,voiceData=null,voiceLoading=null,lastFocus=null;
const mk=(tag,cl,txt)=>{const e=document.createElement(tag);if(cl)e.className=cl;if(txt!==undefined)e.textContent=txt;return e};
function fmtAnswer(it){const wrap=mk('div','nq-ans');if(it.a)wrap.appendChild(mk('div','nq-pre',it.a));if(it.table){const sc=mk('div','nq-tw'),t=mk('table','nq-table'),h=mk('thead'),r=mk('tr');(it.table.head||[]).forEach(x=>r.appendChild(mk('th','',x)));h.appendChild(r);t.appendChild(h);const b=mk('tbody');(it.table.rows||[]).forEach(row=>{const tr=mk('tr');row.forEach(x=>tr.appendChild(mk('td','',x)));b.appendChild(tr)});t.appendChild(b);sc.appendChild(t);wrap.appendChild(sc)}if(it.after)wrap.appendChild(mk('div','nq-pre',it.after));return wrap}
async function getVoices(){if(voiceData)return voiceData;if(!voiceLoading)voiceLoading=(async()=>{const r=await fetch('./مختبر-الأحياء-الجهاز-العصبي.html',{cache:'force-cache'});if(!r.ok)throw Error('تعذّر تحميل التسجيلات الأصلية.');const h=await r.text(),match=h.match(/<script id="nur-qa-data" type="application\/json">([\s\S]*?)<\/script>/);if(!match)throw Error('لم تُعثر على التسجيلات الأصلية.');return JSON.parse(match[1]).audio})().then(x=>voiceData=x).finally(()=>voiceLoading=null);return voiceLoading}
function addVoice(holder,clip){const wrap=mk('div','nq-voice');wrap.appendChild(mk('div','nq-vt','🎧 '+clip.title));const btn=mk('button','', '▶ تشغيل التسجيل الأصلي');btn.type='button';const status=mk('small','');const audio=mk('audio');audio.controls=true;audio.preload='none';audio.hidden=true;btn.onclick=async()=>{btn.disabled=true;status.textContent='جاري تجهيز التسجيل…';try{const d=await getVoices(),src=d[clip.key];if(!src)throw Error('هذا التسجيل غير متوفر.');audio.src=src;audio.hidden=false;status.textContent='';await audio.play()}catch(e){status.textContent=e.message||'تعذّر تشغيل التسجيل.'}finally{btn.disabled=false}};wrap.append(btn,status,audio);holder.appendChild(wrap)}
function render(){if(!data)return;const topic=host.dataset.topic||'all';host.innerHTML='';const header=mk('div','nq-head');header.append(mk('h2','nq-title','سؤال وجواب · '+(TOP[topic]||TOP.all)),mk('button','nq-rec','🎙 التسميع من حفظي'));host.appendChild(header);const grid=mk('div','nq-grid');let count=0;
 for(const sec of data.sections||[]){if(topic!=='all'&&topic!=='wiz'&&sec.topic!==topic)continue;const items=topic==='wiz'?sec.items.filter(i=>i.wiz||(i.years&&i.years.length)):sec.items;if(!items.length)continue;const card=mk('section','nq-card');card.appendChild(mk('h3','nq-st',sec.title));
 const audios=(data.recordings||[]).filter(a=>a.section===sec.title);audios.forEach(a=>addVoice(card,a));const acc=mk('div','nq-acc');items.forEach(it=>{count++;const item=mk('div','nq-item'),button=mk('button','nq-q');button.type='button';button.setAttribute('aria-expanded','false');const qt=mk('span','nq-qt');qt.appendChild(mk('span','',it.q));if(it.wiz)qt.appendChild(mk('span','nq-wiz','وزاري'));(it.years||[]).forEach(y=>qt.appendChild(mk('span','nq-yr',String(y))));button.append(qt,mk('span','nq-chev','⌄'));let ans=null;button.onclick=()=>{const was=item.classList.contains('open');acc.querySelectorAll('.nq-item.open').forEach(c=>{c.classList.remove('open');c.querySelector('.nq-q').setAttribute('aria-expanded','false')});if(!was){if(!ans){ans=fmtAnswer(it);item.appendChild(ans)}item.classList.add('open');button.setAttribute('aria-expanded','true')}};item.appendChild(button);acc.appendChild(item)});card.appendChild(acc);grid.appendChild(card)}host.appendChild(grid);if(!count)host.appendChild(mk('p','qa-loading','ماكو أسئلة بهذا التصنيف.'));}
async function load(){if(data)return; if(!loading)loading=(async()=>{const r=await fetch('./integrated-features.html',{cache:'force-cache'});if(!r.ok)throw Error('تعذّر تحميل الأسئلة.');const t=await r.text(),m=t.match(/<script id="unified-qa-json" type="application\/json">([\s\S]*?)<\/script>/);if(!m)throw Error('ملف الأسئلة غير مكتمل.');data=JSON.parse(m[1]);render()})().finally(()=>loading=null);return loading}
for(const [key,value] of Object.entries(TOP)){const b=mk('button','',value);b.type='button';b.setAttribute('aria-pressed',key==='all');b.onclick=()=>{host.dataset.topic=key;filter.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render();};filter.appendChild(b)}
open.onclick=async()=>{lastFocus=document.activeElement;shell.hidden=false;document.body.style.overflow='hidden';close.focus();try{await load()}catch(e){host.innerHTML='';host.appendChild(mk('p','qa-loading',e?.message||'تعذّر تحميل الأسئلة.'))}};
function exit(){shell.hidden=true;document.body.style.overflow='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
close.onclick=exit;document.addEventListener('keydown',e=>{if(!shell.hidden&&e.key==='Escape'){e.preventDefault();exit()}})
})();
</script>
