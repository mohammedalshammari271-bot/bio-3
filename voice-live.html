<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102c4b">
<title>مختبر الأحياء — تسميع مباشر في نفس الصفحة</title>
<style>
:root{color-scheme:light;font-family:Tahoma,Arial,system-ui,sans-serif;color:#163653;background:#f0f5fa}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
#lab{display:block;width:100%;height:100%;border:0;background:#fff}
#loading{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:22px;background:#f0f5fa}
#loading[hidden]{display:none}
#card{width:min(420px,95%);text-align:center;padding:30px 22px;background:#fff;border:1px solid #d9e4ef;border-radius:22px;box-shadow:0 12px 35px #14426918}
h1{font-size:22px;margin:0 0 12px}p{font-size:14px;line-height:1.8;color:#496579;margin:0 0 16px}
#track{height:9px;background:#e1eaf2;overflow:hidden;border-radius:99px}#bar{width:0;height:100%;background:#2d80b7;transition:width .2s}
#retry{display:block;margin:20px auto 0;background:#164d82;color:white;font:bold 15px Tahoma,Arial;border:0;border-radius:11px;padding:11px 20px;cursor:pointer}
#retry[hidden]{display:none}
</style>
</head>
<body>
<div id="loading" role="status" aria-live="polite"><div id="card"><h1 id="heading">مختبر الأحياء — الجهاز العصبي</h1><p id="message">جاري تحميل مختبر الأحياء مع أدوات السؤال والجواب...</p><div id="track"><div id="bar"></div></div><button type="button" id="retry" hidden>إعادة المحاولة</button></div></div>
<iframe id="lab" title="مختبر الأحياء الموحد: مجسمات وتجارب واختبارات وبطاقات وخرائط وتسميع" allow="microphone; autoplay; fullscreen" loading="eager"></iframe>
<script>
(()=>{'use strict';
const count=21,frame=document.getElementById('lab'),loading=document.getElementById('loading'),heading=document.getElementById('heading'),message=document.getElementById('message'),bar=document.getElementById('bar'),retry=document.getElementById('retry');
let busy=false;
const timeout=25000;
async function loadText(url){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),timeout);try{const r=await fetch(url,{cache:'force-cache',signal:ctrl.signal});if(!r.ok)throw Error('فشل تحميل '+url+' (رمز '+r.status+')');return await r.text()}finally{clearTimeout(timer)}}
async function run(){if(busy)return;busy=true;retry.hidden=true;loading.hidden=false;heading.textContent='مختبر الأحياء — الجهاز العصبي';message.textContent='جاري تجهيز المختبر والتسميع بنفس الصفحة الآمنة...';bar.style.width='0%';
 const parts=new Array(count);let next=0,done=0;
 const patchTask=Promise.all([loadText('./qa-shell.html'),loadText('./qa-inline-tutor.html')]).then(a=>a.join('\n'));
 async function worker(){while(next<count){let i=next++;parts[i]=await loadText('./extended/part-'+String(i).padStart(3,'0')+'.txt');done++;bar.style.width=Math.floor(done/count*94)+'%';message.textContent='تم تحميل '+done+' من '+count+' جزءاً من المختبر.';}}
 try{await Promise.all(Array.from({length:4},worker));const patch=await patchTask,html=parts.join('');
 if(!/^\s*<!doctype html>/i.test(html)||!/<\/body>\s*<\/html>\s*$/i.test(html))throw Error('ملفات المختبر غير مكتملة.');
 if(!patch.includes('id="qa-shell-script"')||!patch.includes('id="qa-inline-tutor-script"'))throw Error('تعذّر تحميل أدوات السؤال والجواب المدمجة.');
 const close=html.lastIndexOf('</body>');if(close<0)throw Error('بنية ملف المختبر غير صحيحة.');
 const joined=html.slice(0,close)+'\n'+patch+'\n'+html.slice(close);
 // Render the complete lab in the same top-level HTTPS document. This keeps
 // microphone permission and recognition in the same page, not an iframe.
 document.open();document.write(joined);document.close();
 }catch(e){heading.textContent='تعذّر تشغيل المختبر';message.textContent=e?.message||'خطأ غير معروف';retry.hidden=false;}finally{busy=false}}
 retry.addEventListener('click',run);run();
})();
</script>
</body>
</html>
